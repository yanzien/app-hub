<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌面操控器</title>
<style>
:root{--bg:#13152a;--card:#1c1f3a;--card2:#252945;--ink:#eef0ff;--ink2:#a6abce;--line:#2e3258;--p:#6366f1;--p2:#8b5cf6;--ok:#10b981;--warn:#f97316;--danger:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 30% 0%,#20233e,#13152a 70%);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.head{padding:20px 22px 12px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--ink2);background:#ffffff10;padding:5px 14px;border-radius:20px}
.logo{font-size:24px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:800;margin-top:10px;background:linear-gradient(120deg,#a5b4fc,#c4b5fd,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tip{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5}
.tip b{color:var(--warn)}
.body{flex:1;overflow-y:auto;padding:8px 18px 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;transition:.22s}
.tool:hover{border-color:var(--p2);transform:translateY(-2px)}
.tool.run{background:#10261c;border-color:var(--ok)}
.tool .ti{font-size:32px}
.tool .tn{font-weight:700;font-size:14px;margin:4px 0 2px}
.tool .td{font-size:11px;color:var(--ink2);margin-bottom:10px;min-height:28px}
.tool button{width:100%;padding:9px;border:none;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.tool .start{background:var(--p);color:#fff}
.tool .start:hover{background:var(--p2)}
.tool .stop{background:var(--warn);color:#fff}
.tool .stop:hover{background:#ea580c}
.restore{margin-top:16px;width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 10px 24px -8px #6366f199}
.restore:hover{transform:translateY(-2px)}
.status{margin-top:12px;text-align:center;font-size:12px;color:var(--ink2);min-height:18px}
.status.err{color:#fca5a5}
.foot{padding:10px;text-align:center;font-size:11px;color:var(--muted);color:#6b7099;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="head">
  <div class="brand"><span class="logo">🖥️</span> YOUNG LAB</div>
  <h1>桌面操控器 · 真实版</h1>
  <div class="tip">真实操控你的桌面图标！<br><b>提示：请关闭桌面「自动排列图标」</b>，否则效果可能不生效。</div>
</div>
<div class="body">
  <div class="grid" id="grid"></div>
  <button class="restore" onclick="stopAll()">↺ 一键复原所有图标</button>
  <div class="status" id="status">初始化中…</div>
</div>
<div class="foot">Young's App Hub · 桌面操控器 · 仅供娱乐</div>

<script>
const TOOLS=[
  {id:'gravity',icon:'🌍',name:'桌面重力器',desc:'图标像被地球吸引一样掉落堆叠'},
  {id:'zeroG',icon:'🛸',name:'桌面失重器',desc:'图标在桌面漂浮游动'},
  {id:'fight',icon:'🥊',name:'图标打架器',desc:'图标互相追逐碰撞'},
  {id:'hide',icon:'🙈',name:'图标消失器',desc:'图标逐渐移出视野（消失）'},
  {id:'mouse',icon:'👆',name:'鼠标寻找器',desc:'箭头实时指向鼠标位置'},
];
const running=new Set();
function render(){
  document.getElementById('grid').innerHTML=TOOLS.map(t=>`
    <div class="tool ${running.has(t.id)?'run':''}" id="t-${t.id}">
      <div class="ti">${t.icon}</div>
      <div class="tn">${t.name}</div>
      <div class="td">${t.desc}</div>
      <button class="start" onclick="toggle('${t.id}')">▶ 开始</button>
      <button class="stop hidden" onclick="toggle('${t.id}')">↺ 恢复</button>
    </div>`).join('');
}
function setStatus(msg,err){const s=document.getElementById('status');s.textContent=msg;s.className='status'+(err?' err':'');}
async function toggle(id){
  const card=document.getElementById('t-'+id);
  if(running.has(id)){
    const r=await window.pywebview.api.stop(id);
    running.delete(id);
  }else{
    const r=await window.pywebview.api.start(id);
    if(r&&r.ok){running.add(id);}
    else{setStatus('启动失败：'+(r&&r.error||'未知'),true);return;}
  }
  render();
}
async function stopAll(){
  const r=await window.pywebview.api.stop_all();
  running.clear();render();
  setStatus(r&&r.ok?'已复原所有图标 ✅':'复原完成',false);
}
window.addEventListener('pywebviewready',async()=>{
  render();
  const r=await window.pywebview.api.ready();
  if(r&&r.ok){
    setStatus('已连接桌面 · 检测到 '+r.count+' 个图标 · 分辨率 '+r.w+'×'+r.h,false);
  }else{
    setStatus('⚠️ 未找到桌面图标：'+(r&&r.error||'')+'（请确认桌面有图标且未勾选自动排列）',true);
  }
});
</script>
</body>
</html>
